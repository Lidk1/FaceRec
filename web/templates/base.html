<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232ee6a8'/><circle cx='16' cy='13' r='5' fill='%2304121a'/><rect x='8' y='20' width='16' height='6' rx='3' fill='%2304121a'/></svg>">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo">FR</div>
    <div>
      FaceNet2Rec 人脸识别
      <small>CAMPUS FACE RECOGNITION · V{{ app_version }}</small>
    </div>
  </div>
  <nav class="nav">
    <a href="/" class="{{ 'active' if active == 'terminal' else '' }}">识别终端</a>
    <a href="/enroll" class="{{ 'active' if active == 'enroll' else '' }}">人脸注册</a>
    <a href="/library" class="{{ 'active' if active == 'library' else '' }}">特征库</a>
  </nav>
  <div class="spacer"></div>
  <div class="status-pill" id="statusPill" title="模型与特征库状态">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">检测中…</span>
  </div>
</header>

<main class="container">
  {% block content %}{% endblock %}
</main>

<div class="footer">
  {{ app_name }} · 相似度阈值 {{ threshold }} · 模型 {{ model_name }} · 特征向量 AES-256-GCM 加密存储，不保存原始人脸图像
</div>

<div class="toast-wrap" id="toastWrap"></div>
<script src="{{ url_for('static', filename='js/common.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
